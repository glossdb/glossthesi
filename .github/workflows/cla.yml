# The contributor licence agreement (CLA.md), signed once on a first pull request by a comment with the sentence
# below; the signatures are kept on the branch `cla-signatures`, which the action writes to. Pull requests from
# contributors who have not signed get a comment and a failing status until they do.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: The agreement, signed or asked for
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/glossdb/glossthesi/blob/main/CLA.md
          branch: cla-signatures
          allowlist: phas02,dependabot[bot]
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be merged, please read the contributor licence agreement in CLA.md and sign it by commenting the sentence below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'The contributor licence agreement is signed by every contributor to this pull request.'
