# The release build: the service image, assembled when a v* tag is
# pushed. A manual dispatch pushes the image by branch and commit — a
# deployment pins a commit between releases. Same shape as glossql's
# release: ghcr.io/glossdb/glossthesi:<version> plus :latest at a tag,
# :<branch> and :sha-<commit> from a dispatch; :latest moves at a tag only.
# This is not CI (tests.yml is): nothing here runs on push. The tests
# run first all the same, so no image is built from a commit that fails
# them; and the started image answers a forecast and a what-if, not only
# /healthz, so an image whose routes are broken is not pushed.
#
# The image is public on GHCR, so Cloud Run pulls it directly — no
# Artifact Registry, no project name here. The version is `version` in
# pyproject.toml, the one bump point: the tag has to match it. Every
# build bakes `<version>+<commit>` as GLOSSTHESI_VERSION (/healthz,
# every log line), whichever route built it — so a tag on a commit that
# already has its :sha-<commit> image does not build again: it names
# that image, the one that was deployed and tested, :<version> and
# :latest. A commit without an image is built, started on the runner's
# CPU and asked /healthz — the checkpoints baked, every voice loaded,
# the version right — and pushed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/glossthesi/kernels.py', 'src/glossthesi/forecast.py') }}
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
        env:
          GLOSSTHESI_DEVICE: cpu
          HF_HUB_DISABLE_TELEMETRY: "1"
  image:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      # What the image calls itself: pyproject's version plus the commit.
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          commit=$(git rev-parse --short=7 HEAD)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} is not pyproject's v${version}"; exit 1
          fi
          echo "version=${version}+${commit}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${commit}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
      # A tag on a commit whose image is already up: name it, don't build it.
      - id: built
        if: github.ref_type == 'tag'
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.version.outputs.sha }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.built.outputs.found == 'true'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | grep -v ":${{ steps.version.outputs.sha }}$" | sed 's/^/-t /' \
            | xargs docker buildx imagetools create "$IMAGE:${{ steps.version.outputs.sha }}"
      # The runner's own docker builds it (no buildx container: the image
      # is gigabytes, and it is run here before it is pushed).
      - uses: docker/build-push-action@v7
        if: steps.built.outputs.found != 'true'
        with:
          context: .
          load: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: smoke
        if: steps.built.outputs.found != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name kernel -p 8100:8100 -e GLOSSTHESI_DEVICE=cpu -e GLOSSTHESI_KEYS=smoke "$IMAGE:${{ steps.version.outputs.sha }}"
          for _ in $(seq 60); do
            if health=$(curl -sf http://127.0.0.1:8100/healthz); then break; fi
            sleep 3
          done
          docker logs kernel
          echo "$health"
          [ "$(echo "$health" | jq -r .loaded)" = true ] || { echo "not loaded"; exit 1; }
          [ "$(echo "$health" | jq -r .version)" = "$VERSION" ] || { echo "version is not $VERSION"; exit 1; }
          # One forecast and one what-if through the doors, in the JSON encoding: the routes answer, nothing fails alone.
          python3 - <<'PY'
          import datetime, json
          months = [f"2025-{m:02d}" for m in range(1, 9)]
          forecast = {"spec": {"targets": ["sales"], "horizon": 2, "levels": [0.1, 0.5, 0.9]},
                      "table": {"member": ["a"] * 8, "period": months, "status": ["actual"] * 6 + ["forecast"] * 2,
                                "sales": [120, 132, 128, 141, 150, 148, None, None]}}
          weeks = [str(datetime.date(2024, 1, 1) + datetime.timedelta(weeks=i)) for i in range(32)]
          history, ahead = weeks[:30], weeks[30:]
          sales = [100 + (i % 4) + 10 * (i % 3 == 0) for i in range(30)]
          promo = [1.0 if i % 3 == 0 else 0.0 for i in range(30)]
          whatif = {"spec": {"targets": ["sales"], "levels": [0.1, 0.5, 0.9]},
                    "table": {"member": ["a"] * 34, "period": history + ahead + ahead,
                              "status": ["actual"] * 30 + ["plan"] * 2 + ["scenario"] * 2,
                              "sales": sales + [None] * 4, "promo": promo + [0.0, 0.0] + [1.0, 1.0]}}
          json.dump({"forecast": forecast, "whatif": whatif}, open("bodies.json", "w"))
          PY
          for route in forecast whatif; do
            jq ".$route" bodies.json > body.json
            code=$(curl -s -o answer.json -w '%{http_code}' -H 'authorization: Bearer smoke' -H 'content-type: application/json' --data @body.json "http://127.0.0.1:8100/$route")
            [ "$code" = 200 ] || { echo "/$route answered $code"; cat answer.json; exit 1; }
            [ "$(jq '.answer.errors | length' answer.json)" = 0 ] || { echo "/$route failed an item"; jq .answer.errors answer.json; exit 1; }
          done
          docker rm -f kernel
      - if: steps.built.outputs.found != 'true'
        run: docker image push --all-tags "$IMAGE"
