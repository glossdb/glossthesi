# The wire in both encodings, the owner, the what-if's reading of a history and the density read against the pinned fixture, on CPU, on every push.
# The image is release.yml's: built at a v* tag, pushed to GHCR.
name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/glossthesi/kernels.py', 'src/glossthesi/forecast.py') }}
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
        env:
          GLOSSTHESI_DEVICE: cpu
          HF_HUB_DISABLE_TELEMETRY: "1"
