[project]
name = "glossthesi"
version = "0.3.0"
description = "The model service behind glossql: forecasts and the walk by Chronos-2, anomaly detection and the what-if by TabICL, over HTTP"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    # Pinned: the oracle fixtures in the port repo were generated with
    # 2.1.1 and 2.2.0 reproduces them (same checkpoints); a move re-runs
    # the parity tests. The `forecast` extra (pandas, statsmodels,
    # matplotlib) is what the package's forecaster imports: the what-if.
    "tabicl[forecast]==2.2.0",
    "torch>=2.13",
    "numpy>=2",
    "starlette>=1.6",
    "uvicorn>=0.52",
    # The checkpoints come from the hub cache; baked into the image at build.
    "huggingface-hub>=0.30",
    # The forecasting model (Chronos-2, Apache-2.0); its weights are baked beside the regressor's. Pinned, as the
    # checkpoint's revision is (`forecast.REVISION`): every measured number describes this package and those weights.
    "chronos-forecasting==2.3.2",
    # The wire: Arrow IPC streams in and out, and the JSON encoding built through the same tables.
    "pyarrow>=17",
]

[project.optional-dependencies]
# ID tokens verified in-process (GLOSSTHESI_AUDIENCE); Google's certificates over HTTPS.
auth = ["google-auth>=2.30", "requests>=2.32"]
# Traces, metrics and logs over OTLP/HTTP to a collector (OTEL_EXPORTER_OTLP_ENDPOINT).
otel = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-asgi>=0.51b0",
]

[project.scripts]
glossthesi = "glossthesi.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "httpx>=0.28",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glossthesi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "BLE", "RUF"]
ignore = [
    "E501",  # lines are long where a sentence is: the comments carry the reasoning
    "B905",  # zip without strict: the arrays zipped are built together; a strict= on every one is noise
]
